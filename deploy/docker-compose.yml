services:
  fleetpulse:
    build:
      context: ..
      dockerfile: Dockerfile
    image: fleetpulse:local
    command:
      - serve
      - -addr
      - 0.0.0.0:35338
      - -auth=true
      - -token-file
      - /var/lib/fleetpulse/token
      - -deployment-target
      - docker
    ports:
      - "35338:35338"
    volumes:
      - fleetpulse-state:/var/lib/fleetpulse
      - fleetpulse-config:/etc/fleetpulse
    restart: unless-stopped

volumes:
  fleetpulse-state:
  fleetpulse-config:
