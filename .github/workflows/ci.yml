name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: go build -o dist/fleetpulse ./cmd/fleetpulse

  matrix-build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_os: linux
          - goos: linux
            goarch: arm64
            artifact_os: linux
          - goos: windows
            goarch: amd64
            artifact_os: windows
          - goos: darwin
            goarch: amd64
            artifact_os: macos
          - goos: darwin
            goarch: arm64
            artifact_os: macos
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Resolve CI release version
        id: release
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main || true
          bash scripts/resolve-release-version.sh --mode ci >> "$GITHUB_OUTPUT"

      - name: Build artifact
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARTIFACT_OS: ${{ matrix.artifact_os }}
          CGO_ENABLED: "0"
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          bash scripts/build-release-artifact.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fleetpulse-${{ steps.release.outputs.version }}-${{ matrix.artifact_os }}-${{ matrix.goarch }}
          path: dist/fleetpulse-${{ steps.release.outputs.version }}-${{ matrix.artifact_os }}-${{ matrix.goarch }}/**
          retention-days: 14

  packaging:
    name: Packaging validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Check shell scripts
        run: |
          bash -n install.sh
          bash -n scripts/resolve-release-version.sh
          bash -n packaging/linux/install.sh
          bash -n packaging/linux/uninstall.sh
          bash -n packaging/macos/install.sh
          bash -n packaging/macos/uninstall.sh

      - name: Check PowerShell scripts
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content packaging/windows/install.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content packaging/windows/uninstall.ps1 -Raw)) | Out-Null

      - name: Check release artifact layout
        run: bash tests/release-artifact-layout.sh

      - name: Check release version resolution
        run: bash tests/release-version.sh

      - name: Check macOS installer clears quarantine
        run: bash tests/macos-install-clears-quarantine.sh

      - name: Check GitHub latest installer
        run: |
          bash tests/github-install-latest.sh
          bash tests/github-install-prerelease.sh

      - name: Check Docker release variants
        run: bash tests/docker-release-variants.sh

      - name: Check GitHub Actions warnings
        run: bash tests/github-actions-warnings.sh

  docker-build:
    name: Docker build ${{ matrix.docker_target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - docker_target: runtime
          - docker_target: cuda
          - docker_target: rocm
          - docker_target: intel-gpu
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Docker build
        env:
          DOCKER_TARGET: ${{ matrix.docker_target }}
        run: docker build --target "$DOCKER_TARGET" -t "fleetpulse:ci-${DOCKER_TARGET}" .
