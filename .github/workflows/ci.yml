name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: go build -o dist/fleetpulse ./cmd/fleetpulse

  matrix-build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_os: linux
          - goos: linux
            goarch: arm64
            artifact_os: linux
          - goos: windows
            goarch: amd64
            artifact_os: windows
          - goos: darwin
            goarch: amd64
            artifact_os: macos
          - goos: darwin
            goarch: arm64
            artifact_os: macos
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build artifact
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARTIFACT_OS: ${{ matrix.artifact_os }}
          CGO_ENABLED: "0"
          RELEASE_VERSION: ci-${{ github.run_number }}
        run: |
          bash scripts/build-release-artifact.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fleetpulse-${{ matrix.artifact_os }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          retention-days: 14

  packaging:
    name: Packaging validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check shell scripts
        run: |
          bash -n packaging/linux/install.sh
          bash -n packaging/linux/uninstall.sh
          bash -n packaging/macos/install.sh
          bash -n packaging/macos/uninstall.sh

      - name: Check PowerShell scripts
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content packaging/windows/install.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content packaging/windows/uninstall.ps1 -Raw)) | Out-Null

      - name: Check release artifact layout
        run: bash tests/release-artifact-layout.sh

      - name: Validate Docker build
        run: docker build -t fleetpulse:ci .
