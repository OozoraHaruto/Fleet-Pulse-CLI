name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.2.3"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Resolve release version
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            prerelease="${{ inputs.prerelease }}"
          else
            version="${GITHUB_REF_NAME}"
            prerelease="false"
          fi

          case "$version" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "version must look like v1.2.3" >&2
              exit 1
              ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_os: linux
          - goos: linux
            goarch: arm64
            artifact_os: linux
          - goos: windows
            goarch: amd64
            artifact_os: windows
          - goos: darwin
            goarch: amd64
            artifact_os: macos
          - goos: darwin
            goarch: arm64
            artifact_os: macos
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test before release build
        run: go test ./...

      - name: Build artifact
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARTIFACT_OS: ${{ matrix.artifact_os }}
          CGO_ENABLED: "0"
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: bash scripts/build-release-artifact.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fleetpulse-${{ matrix.artifact_os }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_VERSION}"
          docker build --build-arg VERSION="$RELEASE_VERSION" --build-arg COMMIT="$GITHUB_SHA" -t "$image" .

      - name: Push Docker image
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_VERSION}"
          docker push "$image"

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - metadata
      - release
      - docker
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FleetPulse ${{ needs.metadata.outputs.version }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.metadata.outputs.prerelease }}
