name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main || true

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            mode="ci"
          else
            mode="final"
          fi

          bash scripts/resolve-release-version.sh --mode "$mode" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$RELEASE_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME must match version.txt $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Validate final version is unique
        if: steps.release.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "release $RELEASE_VERSION already exists" >&2
            exit 1
          fi

      - name: Summarize release metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          case "$PRERELEASE" in
            true|false) ;;
            *)
              echo "invalid prerelease output: $PRERELEASE" >&2
              exit 1
              ;;
          esac

          echo "release version: $RELEASE_VERSION"
          echo "prerelease: $PRERELEASE"

  checks:
    name: Release checks
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: go build -o dist/fleetpulse ./cmd/fleetpulse

      - name: Check shell scripts
        run: |
          bash -n install.sh
          bash -n scripts/resolve-release-version.sh
          bash -n packaging/linux/install.sh
          bash -n packaging/linux/uninstall.sh
          bash -n packaging/macos/install.sh
          bash -n packaging/macos/uninstall.sh

      - name: Check PowerShell scripts
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content packaging/windows/install.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content packaging/windows/uninstall.ps1 -Raw)) | Out-Null

      - name: Check release artifact layout
        run: bash tests/release-artifact-layout.sh

      - name: Check release version resolution
        run: bash tests/release-version.sh

      - name: Check Linux installer migration
        run: bash tests/linux-install-migrates-bind-config.sh

      - name: Check macOS installer clears quarantine
        run: bash tests/macos-install-clears-quarantine.sh

      - name: Check GitHub installers
        run: |
          bash tests/github-install-latest.sh
          bash tests/github-install-prerelease.sh

      - name: Check Docker release variants
        run: bash tests/docker-release-variants.sh

      - name: Check GitHub Actions warnings
        run: bash tests/github-actions-warnings.sh

  docker-checks:
    name: Docker build check ${{ matrix.docker_target }}
    runs-on: ubuntu-latest
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - docker_target: runtime
          - docker_target: cuda
          - docker_target: rocm
          - docker_target: intel-gpu
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Docker build
        env:
          DOCKER_TARGET: ${{ matrix.docker_target }}
        run: docker build --target "$DOCKER_TARGET" -t "fleetpulse:release-check-${DOCKER_TARGET}" .

  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs:
      - metadata
      - checks
      - docker-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_os: linux
          - goos: linux
            goarch: arm64
            artifact_os: linux
          - goos: windows
            goarch: amd64
            artifact_os: windows
          - goos: darwin
            goarch: amd64
            artifact_os: macos
          - goos: darwin
            goarch: arm64
            artifact_os: macos
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Build artifact
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARTIFACT_OS: ${{ matrix.artifact_os }}
          CGO_ENABLED: "0"
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: bash scripts/build-release-artifact.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fleetpulse-${{ matrix.artifact_os }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs:
      - metadata
      - checks
      - docker-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - docker_target: runtime
            image_suffix: ""
          - docker_target: cuda
            image_suffix: "-cuda"
          - docker_target: rocm
            image_suffix: "-rocm"
          - docker_target: intel-gpu
            image_suffix: "-intel-gpu"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        env:
          DOCKER_TARGET: ${{ matrix.docker_target }}
          IMAGE_SUFFIX: ${{ matrix.image_suffix }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_VERSION}${IMAGE_SUFFIX}"
          docker build --target "$DOCKER_TARGET" --build-arg VERSION="$RELEASE_VERSION" --build-arg COMMIT="$GITHUB_SHA" -t "$image" .

      - name: Push Docker image
        env:
          IMAGE_SUFFIX: ${{ matrix.image_suffix }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_VERSION}${IMAGE_SUFFIX}"
          docker push "$image"

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - metadata
      - checks
      - docker-checks
      - release
      - docker
    steps:
      - name: Replace existing CI prerelease
        if: needs.metadata.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release delete "$RELEASE_VERSION" --yes
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FleetPulse ${{ needs.metadata.outputs.version }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          make_latest: ${{ needs.metadata.outputs.prerelease == 'false' }}
