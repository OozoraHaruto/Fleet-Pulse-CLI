name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main || true

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            mode="ci"
          else
            mode="final"
          fi

          bash scripts/resolve-release-version.sh --mode "$mode" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$RELEASE_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME must match version.txt $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Validate final version is unique
        if: steps.release.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "release $RELEASE_VERSION already exists" >&2
            exit 1
          fi

      - name: Remove existing CI prerelease
        if: steps.release.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release delete "$RELEASE_VERSION" --cleanup-tag --yes
          fi

      - name: Summarize release metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          case "$PRERELEASE" in
            true|false) ;;
            *)
              echo "invalid prerelease output: $PRERELEASE" >&2
              exit 1
              ;;
          esac

          echo "release version: $RELEASE_VERSION"
          echo "prerelease: $PRERELEASE"

  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_os: linux
          - goos: linux
            goarch: arm64
            artifact_os: linux
          - goos: windows
            goarch: amd64
            artifact_os: windows
          - goos: darwin
            goarch: amd64
            artifact_os: macos
          - goos: darwin
            goarch: arm64
            artifact_os: macos
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test before release build
        run: go test ./...

      - name: Build artifact
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARTIFACT_OS: ${{ matrix.artifact_os }}
          CGO_ENABLED: "0"
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: bash scripts/build-release-artifact.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fleetpulse-${{ matrix.artifact_os }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_VERSION}"
          docker build --build-arg VERSION="$RELEASE_VERSION" --build-arg COMMIT="$GITHUB_SHA" -t "$image" .

      - name: Push Docker image
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_VERSION}"
          docker push "$image"

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - metadata
      - release
      - docker
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FleetPulse ${{ needs.metadata.outputs.version }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.metadata.outputs.prerelease }}
